name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-auth-secret-not-used-in-production
      AUTH_URL: http://127.0.0.1:3000
      MONGODB_URI: mongodb://127.0.0.1:27017/saas
      MONGODB_DB: saas
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        run: npm run test:e2e
